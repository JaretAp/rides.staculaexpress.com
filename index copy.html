<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
    
    <title>Stacula Express</title>
  </head>

  <body>
    <nav class="navbar bg-black sticky-top border-bottom border-body" data-bs-theme="dark">
      <div class="container-fluid">
        <div class="logo-case">
        <a class="navbar-brand"  href="#">Stacula Black & RS Express LLC</a></div>

        <button
          class="navbar-toggler top-toggle"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasDarkNavbar"
          aria-controls="offcanvasDarkNavbar"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="offcanvas offcanvas-end text-bg-dark"
          tabindex="-1"
          id="offcanvasDarkNavbar"
          aria-labelledby="offcanvasDarkNavbarLabel"
        >
          <div class="offcanvas-header bg-black">
            <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">
              sales@staculaexpress.com
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body bg-black">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="true"
                >
                  Dropdown
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                  <li><a class="dropdown-item" href="#">Action</a></li>
                  <li><a class="dropdown-item" href="#">Another action</a></li>
                  <li>
                    <hr class="dropdown-divider" />
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">Something else here</a>
                  </li>
                </ul>
              </li>
            </ul>
            <form class="d-flex mt-3" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <div class="company-name">
      <h1>Stacula Black & RS Express LLC</h1>
    </div>
    <div class="pic-box-container">
      <div class="images-construction">
        <div id="box-one" class="box-img">
          <div id="img-container">
            <img
              src="Tesla/DSC00095.JPG"
              alt="black tesla"
              id="hammer"/>
          </div>
        </div>
        <div id="box-two" class="box-img">
          <div id="img-container-two">
            <img
              src="Tesla/pexels-jeshoots-com-147458-13861.jpg"
              alt="driver in car"
              id="building"
            />
          </div>
        </div>
        <div id="box-three" class="box-img">
          <div id="img-container-three">
            <img
              src="Tesla/DSC00104.JPG"
              alt="black tesla"
              id="drill"/>
          </div>
        </div>
      </div>
    </div>
    <div class="message-to-public">
      <p class="message">The Best & Private Service in Charlotte</p>
    </div>
   

    <script src="bootstrap-5.3.3-dist/dist/js/bootstrap.min.js"></script>
</body>
</html>
